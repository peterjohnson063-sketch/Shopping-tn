<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 64" role="img" aria-label="Everest — Hit Your Dreams">
  <defs>
    <!-- Tagline: tan / bronze / ochre (like your reference) -->
    <linearGradient id="evGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5a2b"/>
      <stop offset="45%" stop-color="#b87333"/>
      <stop offset="100%" stop-color="#c9a44c"/>
    </linearGradient>
    <!-- Everest: deep indigo left → vibrant violet right (like your reference) -->
    <linearGradient id="evBrand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e0a4e"/>
      <stop offset="42%" stop-color="#4c1d95"/>
      <stop offset="78%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- No filters: some browsers blank &lt;img&gt; SVGs when filters mis-render -->
  <text x="4" y="36" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="700" fill="url(#evBrand)" letter-spacing="-0.02em">Everest</text>
  <text x="4" y="56" font-family="Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="url(#evGold)" letter-spacing="0.12em">HIT YOUR DREAMS</text>
</svg>
